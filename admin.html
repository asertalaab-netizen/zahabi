<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAHABI — Admin Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #070707; color: #e5e7eb; font-family: 'Montserrat', sans-serif; }
        .zahabi-heading { font-family: 'Cinzel', serif; color: #dfc28e; }
        input, select { background: rgba(0,0,0,0.6); border: 1px solid rgba(223,194,142,0.3); color: #fff; outline: none; }
        input:focus, select:focus { border-color: #dfc28e; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6">

    <!-- LOGIN SECTION -->
    <div id="login-section" class="max-w-md w-full mx-auto my-auto bg-black/80 border border-[#dfc28e]/30 p-8 rounded shadow-2xl">
        <h2 class="zahabi-heading text-2xl font-bold text-center mb-6 tracking-widest">ADMIN LOGIN</h2>
        <div class="space-y-4">
            <input type="email" id="admin-email" placeholder="Admin Email" class="w-full p-3 text-sm">
            <input type="password" id="admin-pass" placeholder="Password" class="w-full p-3 text-sm">
            <button onclick="loginAdmin()" class="w-full py-3 bg-[#dfc28e] text-black font-bold tracking-widest text-xs uppercase hover:bg-[#c5a059] transition-all cursor-pointer">LOGIN</button>
            <p id="login-error" class="text-red-400 text-xs text-center hidden">بيانات الدخول غير صحيحة!</p>
        </div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard-section" class="max-w-4xl w-full mx-auto hidden space-y-8 pt-10">
        <div class="flex justify-between items-center border-b border-[#dfc28e]/20 pb-4">
            <h1 class="zahabi-heading text-2xl tracking-widest">ZAHABI ADMIN DASHBOARD</h1>
            <button onclick="logoutAdmin()" class="text-xs text-red-400 hover:text-red-300 tracking-wider cursor-pointer"><i class="fa-solid fa-right-from-bracket"></i> LOGOUT</button>
        </div>

        <!-- ADD PRODUCT FORM -->
        <div class="bg-black/60 border border-[#dfc28e]/20 p-6 rounded">
            <h3 class="text-sm text-[#dfc28e] tracking-widest font-bold uppercase mb-4">إضافة منتج جديد (أونلاين لكل الأجهزة)</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <input type="text" id="p-title" placeholder="اسم المنتج (مثال: هات ال 100 جنيه)" class="p-3 text-xs">
                <input type="text" id="p-price" placeholder="السعر (مثال: 100 EGP)" class="p-3 text-xs">
                <input type="text" id="p-category" placeholder="الفئة (مثال: sweatpants)" class="p-3 text-xs">
                <input type="text" id="p-image" placeholder="رابط الصورة (مثال: https://...)" class="p-3 text-xs">
                <input type="text" id="p-sizes" placeholder="المقاسات مفصولة بفاصلة (مثال: M,L,XL)" class="p-3 text-xs sm:col-span-2">
            </div>
            <button onclick="addProduct()" class="mt-4 w-full py-3 bg-[#dfc28e] text-black font-bold tracking-widest text-xs uppercase hover:bg-[#c5a059] transition-all cursor-pointer">إضافة المنتج إلى قاعدة البيانات</button>
        </div>

        <!-- PRODUCTS LIST FROM SUPABASE -->
        <div class="bg-black/60 border border-[#dfc28e]/20 p-6 rounded">
            <h3 class="text-sm text-[#dfc28e] tracking-widest font-bold uppercase mb-4">المنتجات المسجلة في Supabase</h3>
            <div id="admin-products-list" class="space-y-3"></div>
        </div>
    </div>

    <script>
       const SUPABASE_URL = 'https://kyfyxbelxohjxfyoygmv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_m0BqNWRSeOBHRgFnzQ12ww_0Ejdleu7';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const ADMIN_EMAIL = "admin@zahabi.com";
        const ADMIN_PASS = "zahabi123";

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('zahabi_admin_auth') === 'true') {
                showDashboard();
            }
        });

        function loginAdmin() {
            const email = document.getElementById('admin-email').value.trim();
            const pass = document.getElementById('admin-pass').value.trim();

            if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                sessionStorage.setItem('zahabi_admin_auth', 'true');
                showDashboard();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('zahabi_admin_auth');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }

        function showDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            fetchAdminProducts();
        }

        async function addProduct() {
            const title = document.getElementById('p-title').value.trim();
            let price = document.getElementById('p-price').value.trim();
            const category = document.getElementById('p-category').value.trim() || 'sweatpants';
            const image = document.getElementById('p-image').value.trim() || 'https://i.pinimg.com/originals/38/c0/2d/38c02df6b1fd2f3735cf1be0582bdce0.jpg?nii=t';
            const sizes = document.getElementById('p-sizes').value.trim() || 'M,L,XL';

            if (!title || !price) {
                alert('ادخل الاسم والسعر على الأقل!');
                return;
            }

            if (!price.includes('EGP')) price += ' EGP';

            const { data, error } = await _supabase
                .from('products')
                .insert([{ title, price, category, image, sizes }]);

            if (error) {
                alert('حدث خطأ أثناء الحفظ: ' + error.message);
            } else {
                alert('تم إضافة المنتج بنجاح إلى قاعدة البيانات السحابية!');
                document.getElementById('p-title').value = '';
                document.getElementById('p-price').value = '';
                document.getElementById('p-category').value = '';
                document.getElementById('p-image').value = '';
                document.getElementById('p-sizes').value = '';
                fetchAdminProducts();
            }
        }

        async function fetchAdminProducts() {
            const container = document.getElementById('admin-products-list');
            container.innerHTML = '<p class="text-xs text-gray-400">جاري التحميل من Supabase...</p>';

            const { data: products, error } = await _supabase
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error || !products || products.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-400">لا توجد منتجات مسجلة حتى الآن في Supabase.</p>';
                return;
            }

            container.innerHTML = '';
            products.forEach(product => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between border-b border-white/5 pb-2 text-xs';
                row.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${product.image}" class="w-8 h-8 object-contain bg-black/40 border border-[#dfc28e]/20 p-1">
                        <div>
                            <span class="text-[#dfc28e] font-semibold">${product.title}</span>
                            <span class="text-gray-400 ml-2">(${product.price})</span>
                        </div>
                    </div>
                    <button onclick="deleteProduct(${product.id})" class="text-red-400 hover:text-red-300 p-1 cursor-pointer"><i class="fa-solid fa-trash-can"></i> حذف</button>
                `;
                container.appendChild(row);
            });
        }

        async function deleteProduct(id) {
            if(!confirm('هل أنت متأكد من حذف هذا المنتج من السيرفر؟')) return;

            const { error } = await _supabase
                .from('products')
                .delete()
                .eq('id', id);

            if (error) {
                alert('حدث خطأ أثناء الحذف: ' + error.message);
            } else {
                fetchAdminProducts();
            }
        }
    </script>
</body>
</html>
